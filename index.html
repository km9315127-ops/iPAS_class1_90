  <title>淨零碳規劃管理師能力鑑定學習指引（考科一）節能減碳技術實務</title>
  <style>
    :root {

      --card: #ffffff;

      --primary: #0f766e;
      --primary-2: #14b8a6;
      --border: #dbe3ee;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {

    }
    .app { max-width: 860px; margin: 0 auto; padding: 14px 14px 120px; }
    .hero, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero {
      padding: 18px;
      margin-top: 12px;
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
      color: #fff;
      border: none;
    }
    .hero h1 {
      margin: 0 0 8px;
      font-size: 1.18rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .hero p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.96;
      line-height: 1.65;
    }
    .producer {
      margin-top: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      opacity: 0.98;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    .chipbox {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .chipbox label, .chipbox select, .chipbox input {
      display: block;
      width: 100%;
      font-size: 0.95rem;
    }
    .chipbox label {
      color: var(--sub);
      margin-bottom: 8px;
      font-weight: 700;
    }
    select, input[type="number"] {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      color: var(--text);
      font-size: 1rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat { padding: 12px; text-align: center; }
    .stat .label { font-size: 0.8rem; color: var(--sub); margin-bottom: 6px; }
    .stat .value { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .card { padding: 16px; margin-bottom: 14px; }
    .q-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ecfeff;
      color: #155e75;
      border: 1px solid #bae6fd;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      max-width: 100%;
      word-break: break-word;
    }
    .progress-wrap { margin-bottom: 12px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 8px;
    }
    .bar {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width 0.25s ease;
    }
    .question {
      display: block;
      visibility: visible;
      color: #111827;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.8;
      margin: 10px 0 14px;
      white-space: normal;
      word-break: break-word;
      min-height: 3.6em;
    }
    .hint {
      display: block;
      color: var(--sub);
      font-size: 0.92rem;
      margin-bottom: 10px;
    }
    .options { display: grid; gap: 10px; }
    .option {
      display: block;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      background: #fff;
      cursor: pointer;
      transition: 0.18s ease;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }
    .option input {
      margin-right: 10px;
      vertical-align: middle;
      pointer-events: none;
    }
    .option.active { border-color: var(--primary-2); background: #ecfeff; }
    .option.correct { border-color: #86efac; background: #f0fdf4; }
    .option.wrong { border-color: #fca5a5; background: #fef2f2; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      min-height: 48px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #e6fffb; color: #115e59; }
    .btn-muted { background: #eef2f7; color: #334155; }
    .result {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 0.95rem;
      display: none;
      word-break: break-word;
    }
    .result.show { display: block; }
    .result.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .result.ng { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .footer-panel {
      position: sticky;
      bottom: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .summary { display: none; padding: 18px; }
    .summary.show { display: block; }
    .summary h2 { margin-top: 0; font-size: 1.3rem; }
    .score-big { font-size: 2rem; font-weight: 900; color: var(--primary); margin: 8px 0 14px; }
    .review-list { display: grid; gap: 10px; margin-top: 14px; }
    .review-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }
    .review-item.ok { border-left: 6px solid #22c55e; }
    .review-item.ng { border-left: 6px solid #ef4444; }
    .mini { font-size: 0.9rem; color: var(--sub); line-height: 1.6; }
    .deploy-note {
      margin-top: 12px;
      color: var(--sub);
      font-size: 0.88rem;
      line-height: 1.6;
    }
    @media (max-width: 560px) {
      .app { padding: 12px 12px 120px; }
      .toolbar, .stats, .actions, .footer-panel { grid-template-columns: 1fr; }
      .hero h1 { font-size: 1.02rem; }
      .hero p { font-size: 0.9rem; }
      .question { font-size: 0.98rem; line-height: 1.75; }
      .card { padding: 14px; }
      .badge { font-size: 0.8rem; }
    }
  </style>
</head>

  <div class="app">
    <section class="hero">

      <div class="producer">製作人：屏科大 楊忠原</div>
    </section>

    <section class="toolbar">
      <div class="chipbox">
        <label for="chapterFilter">章節篩選</label>
        <select id="chapterFilter">
          <option value="all">全部章節</option>
          <option value="第一章｜組織節能減碳策略">第一章｜組織節能減碳策略</option>
          <option value="第二章｜節能技術應用與能源管理">第二章｜節能技術應用與能源管理</option>
          <option value="第三章｜再生能源與綠電導入">第三章｜再生能源與綠電導入</option>

      </div>
      <div class="chipbox">
        <label for="questionCount">題數</label>
        <input id="questionCount" type="number" min="5" max="90" value="20" />
      </div>
    </section>

    <section class="stats">
      <div class="card stat"><div class="label">總題庫</div><div class="value" id="totalBank">90</div></div>
      <div class="card stat"><div class="label">本次題數</div><div class="value" id="sessionCount">20</div></div>
      <div class="card stat"><div class="label">目前得分</div><div class="value" id="liveScore">0</div></div>
      <div class="card stat"><div class="label">完成率</div><div class="value" id="liveProgress">0%</div></div>
    </section>

    <section class="card" id="quizCard">
      <div class="q-top">
        <div class="badge" id="chapterBadge">章節</div>
        <div class="badge" id="questionIndex">第 1 題 / 20</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span>作答進度</span>
          <span id="progressText">0 / 20</span>
        </div>
        <div class="bar"><div id="progressBar"></div></div>
      </div>

      <div class="hint" id="typeHint">題型：單選題</div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="result" id="resultBox"></div>

      <div class="actions">
        <button class="btn-secondary" id="checkBtn">送出答案</button>
        <button class="btn-muted" id="prevBtn">上一題</button>
        <button class="btn-primary" id="nextBtn">下一題</button>
      </div>
    </section>

    <section class="card summary" id="summaryCard">
      <h2>本次模擬完成</h2>
      <div class="score-big" id="finalScore">0 / 0</div>
      <div class="mini" id="finalText"></div>
      <div class="actions" style="margin-top:14px;">
        <button class="btn-primary" id="restartBtn">重新抽題</button>
        <button class="btn-secondary" id="reviewBtn">只看錯題</button>
        <button class="btn-muted" id="backQuizBtn">回到測驗</button>
      </div>
      <div class="review-list" id="reviewList"></div>
    </section>

    <div class="footer-panel" id="footerPanel" style="display:none;">
      <button class="btn-primary" id="generateBtn">重新抽題</button>
      <button class="btn-muted" id="submitAllBtn">交卷看成績</button>
    </div>

    <div class="deploy-note">
      發佈建議：將此單一 HTML 檔部署到 GitHub Pages、Netlify 或 Vercel。Facebook 可直接貼網址，Instagram 可放 bio 連結。
    </div>
  </div>

  <script>
    const questionBank = [
      {id:1, chapter:'第一章｜組織節能減碳策略', type:'single', question:'下列哪一項最能反映「絕對減量目標」的管理特性？', options:['排放可隨產量改變','需搭配營收成長率','不論營運成長，排放量須下降','僅適用於製造業'], answer:2},
      {id:2, chapter:'第一章｜組織節能減碳策略', type:'single', question:'依照減碳路徑設定的年度需減碳量，正確計算邏輯為何？', options:['基準年－目標年','BAU 排放－目標允許排放','總排放－範疇三排放','用電量 × 電價'], answer:1},
      {id:3, chapter:'第一章｜組織節能減碳策略', type:'single', question:'某企業已完成減碳目標設定，但在實際路徑規劃時，發現每年需減碳量波動極大。最可能的根本原因為何？', options:['減碳目標設定採用絕對減量法','BAU 情境假設未考量營收成長','減碳目標年設定為 2050 年','目標參考 SBTi 方法學不符合產業趨勢'], answer:1},
      {id:4, chapter:'第一章｜組織節能減碳策略', type:'single', question:'企業在設定減碳目標前，最重要的管理前提為何？', options:['選擇可行的減碳技術','完成碳盤查並建立管理基準','評估碳費價格','先設定減碳百分比'], answer:1},
      {id:5, chapter:'第一章｜組織節能減碳策略', type:'single', question:'在路徑規劃中，「BAU 排放趨勢」的主要用途為何？', options:['作為減碳目標的替代方案','預測實際未來排放量','作為不減碳情境下的比較基準','用來計算碳費成本'], answer:2},
      {id:6, chapter:'第一章｜組織節能減碳策略', type:'single', question:'下列哪一種情況，最可能顯示企業的減碳路徑設定過於寬鬆或容易？', options:['未採取減碳措施實際排放量略高於允許排放量','未採取減碳措施實際排放量長期低於允許排放量','BAU 排放與允許排放接近','不需要碳權也能自行調整排放報告抵扣碳費'], answer:1},
      {id:7, chapter:'第一章｜組織節能減碳策略', type:'single', question:'某企業基準年（2023 年）排放量為 100,000 tCO2e，設定 2030 年減量 30% 的絕對減量目標。2030 年的目標允許排放量為何？', options:['70,000 tCO2e','73,000 tCO2e','30,000 tCO2e','130,000 tCO2e'], answer:0},
      {id:8, chapter:'第一章｜組織節能減碳策略', type:'multi', question:'企業在設定減碳目標時，下列哪些原則有助於確保基準年與目標年的管理有效性？', options:['基準年應選擇資料完整且能代表正常營運狀態的年度','基準年應選擇排放量最低的年度，以提高減量成效','目標年需考量企業中長期轉型與投資時程','基準年與目標年的設定會影響年度減碳計算與可比較性'], answer:[0,2,3]},
      {id:9, chapter:'第一章｜組織節能減碳策略', type:'multi', question:'某企業以「營收年成長 5%」作為 BAU 用電推估依據。在哪些情況下，此 BAU 假設最可能高估未來排放？', options:['製程自動化提升單位產出效率','電力排碳係數下降','增設新產線屬於高耗能製程','產品組合轉向高附加價值低用電'], answer:[0,1,3]},
      {id:10, chapter:'第一章｜組織節能減碳策略', type:'multi', question:'跨國企業在不同地區用電結構差異大，下列哪些做法有助於提升減碳目標及路徑可管理性？', options:['依各主要營運地區分別建立 BAU 用電成長假設與排放係數','以集團總部總用電量作為 BAU 推估','對高用電占比或高成長地區，個別設定年度允許排放量','將所有地區套用同一電力排放係數'], answer:[0,2]},
      {id:11, chapter:'第一章｜組織節能減碳策略', type:'single', question:'相較一般設備投資，減碳投資更需要風險評估的核心原因為何？', options:['投資金額較小','易受能源價格與政策影響','投資回收期較短','無法享有碳費減免'], answer:1},
      {id:12, chapter:'第一章｜組織節能減碳策略', type:'single', question:'在資本預算有限下，若企業希望兼顧財務穩健與長期減碳目標，較符合財務決策模型的實務應用邏輯為何？', options:['依單位減碳成本最低者優先執行','優先選擇短期最大減碳量方案','透過財務模型比較不同方案在成本、效益與風險上的時間差異，進行組合配置','暫緩所有投資'], answer:2},
      {id:13, chapter:'第一章｜組織節能減碳策略', type:'single', question:'同一節能措施每年可固定節省 10,000 MWh。若電價每年調升 6%，其年度節省電費金額趨勢最接近何者？', options:['逐年下降','逐年上升','大致不變','先上升後下降'], answer:1},
      {id:14, chapter:'第一章｜組織節能減碳策略', type:'single', question:'某廠年用電 100,000 MWh、電價 3 元/kWh。節能後用電降 8%，但電價升到 3.2 元/kWh。只看年度電費變化最接近何者？', options:['年度電費上升約 560 萬','年度電費下降約 560 萬','年度電費上升約 480 萬','年度電費下降約 480 萬'], answer:1},
      {id:15, chapter:'第一章｜組織節能減碳策略', type:'single', question:'某減碳專案以公司既定折現率評估後，NPV = +120 萬。下列判斷何者最符合財務意涵？', options:['代表專案比其他替代方案更好','代表專案在既定折現率下可帶來正的財務價值','代表專案回收年限一定符合要求','代表專案風險低，可不做敏感度分析'], answer:1},
      {id:16, chapter:'第一章｜組織節能減碳策略', type:'single', question:'下列哪一描述最符合對減碳方案進行「敏感度分析」的核心精神？', options:['同時把電價、碳費、投資額一起改動，模擬最壞情境','以專家訪談方式評估風險高低','把所有不確定性用極值處理','在其他條件固定下，觀察某一關鍵假設變動對財務結果的影響'], answer:3},
      {id:17, chapter:'第一章｜組織節能減碳策略', type:'single', question:'關於邊際減量成本（MAC），下列何者敘述錯誤？', options:['MAC 代表每減一噸 CO2e 的淨成本','MAC 可用於跨方案成本效率比較','MAC 為負值表示通常應優先投資','MAC 代表方案總投資金額'], answer:3},
      {id:18, chapter:'第一章｜組織節能減碳策略', type:'multi', question:'若要用邊際減量成本曲線（MACC）支援「減排路徑組合」設計，可從 MACC 圖上得知哪些資訊？', options:['各方案可提供的減排量','各方案的導入時程與可用年度','各方案的每噸減排成本','各方案的優先採用排序'], answer:[0,2,3]},
      {id:19, chapter:'第一章｜組織節能減碳策略', type:'multi', question:'減碳方案的財務模型通常需納入哪些關鍵要素？', options:['節能設備效率提升所帶來的節省電費','電價政策或燃料成本','與 BAU 相比的用電成本差異','節能設備的技術效率參數本身即可取代財務模型'], answer:[0,1,2]},

      {id:87, chapter:'第三章｜再生能源與綠電導入', type:'single', question:'企業選用太陽光電為來源之綠電時，主要限制為何？', options:['太陽光電屬不間歇能源','夜間無法發電，需搭配台電供應','必須與風電綁定購買','台灣太陽光電太少'], answer:1},

      {id:89, chapter:'第三章｜再生能源與綠電導入', type:'single', question:'為使綠電真正符合企業生產排程，企業應採取何種策略？', options:['全年平均綠電即可','僅依成本選便宜綠電','只需購買更多 T-REC','分析生產用電特性與逐時匹配綠電供應'], answer:3},

    ];

    let sessionQuestions = [];
    let currentIndex = 0;
    let selectedAnswers = {};
    let checkedQuestions = {};

    const els = {
      chapterFilter: document.getElementById('chapterFilter'),
      questionCount: document.getElementById('questionCount'),
      totalBank: document.getElementById('totalBank'),
      sessionCount: document.getElementById('sessionCount'),
      liveScore: document.getElementById('liveScore'),
      liveProgress: document.getElementById('liveProgress'),
      chapterBadge: document.getElementById('chapterBadge'),
      questionIndex: document.getElementById('questionIndex'),
      progressText: document.getElementById('progressText'),
      progressBar: document.getElementById('progressBar'),
      typeHint: document.getElementById('typeHint'),
      questionText: document.getElementById('questionText'),
      optionsWrap: document.getElementById('optionsWrap'),
      resultBox: document.getElementById('resultBox'),
      checkBtn: document.getElementById('checkBtn'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      generateBtn: document.getElementById('generateBtn'),
      submitAllBtn: document.getElementById('submitAllBtn'),
      summaryCard: document.getElementById('summaryCard'),
      finalScore: document.getElementById('finalScore'),
      finalText: document.getElementById('finalText'),
      reviewList: document.getElementById('reviewList'),
      restartBtn: document.getElementById('restartBtn'),
      reviewBtn: document.getElementById('reviewBtn'),
      backQuizBtn: document.getElementById('backQuizBtn'),
      quizCard: document.getElementById('quizCard')
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getFilteredBank() {
      const chapter = els.chapterFilter.value;
      if (chapter === 'all') return questionBank;
      return questionBank.filter(q => q.chapter === chapter);
    }

    function generateSession() {
      const bank = getFilteredBank();
      const maxCount = bank.length;
      const count = Math.max(5, Math.min(parseInt(els.questionCount.value || '20', 10), maxCount));
      sessionQuestions = shuffle(bank).slice(0, count);
      currentIndex = 0;
      selectedAnswers = {};
      checkedQuestions = {};
      els.summaryCard.classList.remove('show');
      els.quizCard.style.display = 'block';
      els.sessionCount.textContent = String(count);
      render();
    }

    function normalizeSelection(v) {
      if (Array.isArray(v)) return [...v].sort((a,b)=>a-b);
      return v;
    }

    function isCorrect(q, selected) {
      if (q.type === 'multi') {
        const a = normalizeSelection(selected || []);
        const b = normalizeSelection(q.answer || []);
        return JSON.stringify(a) === JSON.stringify(b);
      }
      return selected === q.answer;
    }

    function getScore() {
      return sessionQuestions.reduce((sum, q) => sum + (isCorrect(q, selectedAnswers[q.id]) ? 1 : 0), 0);
    }

    function getCompleted() {
      return sessionQuestions.filter(q => {
        const val = selectedAnswers[q.id];
        return q.type === 'multi' ? Array.isArray(val) && val.length > 0 : val !== undefined;
      }).length;
    }

    function renderStats() {
      const totalBank = getFilteredBank().length;
      const score = getScore();
      const done = getCompleted();
      els.totalBank.textContent = String(totalBank);
      els.liveScore.textContent = `${score}`;
      els.liveProgress.textContent = `${Math.round(done / Math.max(sessionQuestions.length, 1) * 100)}%`;
    }

    function answerLabel(q) {
      if (q.type === 'multi') {
        return q.answer.map(i => `${String.fromCharCode(65+i)}. ${q.options[i]}`).join(' / ');
      }
      return `${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`;
    }

    function pickedLabel(q, picked) {
      if (q.type === 'multi') {
        if (!Array.isArray(picked) || !picked.length) return '未作答';
        return picked.sort((a,b)=>a-b).map(i => `${String.fromCharCode(65+i)}. ${q.options[i]}`).join(' / ');
      }
      if (picked === undefined) return '未作答';
      return `${String.fromCharCode(65 + picked)}. ${q.options[picked]}`;
    }

    function render() {
      if (!sessionQuestions.length) return;
      const q = sessionQuestions[currentIndex];
      const done = getCompleted();
      const picked = selectedAnswers[q.id];
      const checked = !!checkedQuestions[q.id];
      els.chapterBadge.textContent = q.chapter;
      els.questionIndex.textContent = `第 ${currentIndex + 1} 題 / ${sessionQuestions.length}`;
      els.progressText.textContent = `${done} / ${sessionQuestions.length}`;
      els.progressBar.style.width = `${done / sessionQuestions.length * 100}%`;
      els.typeHint.textContent = `題型：${q.type === 'multi' ? '複選題（可複選）' : '單選題'}`;
      els.questionText.textContent = q.question;
      els.optionsWrap.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const active = q.type === 'multi' ? Array.isArray(picked) && picked.includes(idx) : picked === idx;
        const label = document.createElement('label');
        label.className = 'option';
        if (active) label.classList.add('active');
        if (checked) {
          const isAns = q.type === 'multi' ? q.answer.includes(idx) : q.answer === idx;
          if (isAns) label.classList.add('correct');
          if (active && !isAns) label.classList.add('wrong');
        }
        const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
        label.innerHTML = `<input type="${inputType}" ${active ? 'checked' : ''}/> <strong>${String.fromCharCode(65 + idx)}.</strong> ${opt}`;
        label.addEventListener('click', (e) => {
          e.preventDefault();
          if (q.type === 'multi') {
            const arr = Array.isArray(selectedAnswers[q.id]) ? [...selectedAnswers[q.id]] : [];
            const pos = arr.indexOf(idx);
            if (pos >= 0) arr.splice(pos, 1); else arr.push(idx);
            selectedAnswers[q.id] = arr;
          } else {
            selectedAnswers[q.id] = idx;
          }
          checkedQuestions[q.id] = false;
          render();
        });
        els.optionsWrap.appendChild(label);
      });

      if (checked) {
        const ok = isCorrect(q, picked);
        els.resultBox.className = `result show ${ok ? 'ok' : 'ng'}`;
        els.resultBox.innerHTML = `<strong>${ok ? '答對了' : '答錯了'}</strong><br>正確答案：${answerLabel(q)}`;
      } else {
        els.resultBox.className = 'result';
        els.resultBox.innerHTML = '';
      }

      const isLastQuestion = currentIndex === sessionQuestions.length - 1;
      document.getElementById('footerPanel').style.display = isLastQuestion ? 'grid' : 'none';
      els.nextBtn.textContent = isLastQuestion ? '完成本次作答' : '下一題';
      renderStats();
    }

    function hasAnswer(q) {
      const picked = selectedAnswers[q.id];
      return q.type === 'multi' ? Array.isArray(picked) && picked.length > 0 : picked !== undefined;
    }

    function checkAnswer() {
      const q = sessionQuestions[currentIndex];
      if (!hasAnswer(q)) {
        alert('請先選擇答案。');
        return;
      }
      checkedQuestions[q.id] = true;
      render();
    }

    function showSummary(onlyWrong = false) {
      const total = sessionQuestions.length;
      const score = getScore();
      const wrongItems = sessionQuestions.filter(q => !isCorrect(q, selectedAnswers[q.id]));
      const reviewData = onlyWrong ? wrongItems : sessionQuestions;
      els.quizCard.style.display = 'none';
      els.summaryCard.classList.add('show');
      document.getElementById('footerPanel').style.display = 'none';
      els.finalScore.textContent = `${score} / ${total}`;
      els.finalText.textContent = `答對 ${score} 題，答錯 ${total - score} 題，正確率 ${Math.round(score / total * 100)}%。`;
      els.reviewList.innerHTML = '';
      reviewData.forEach(q => {
        const ok = isCorrect(q, selectedAnswers[q.id]);
        const item = document.createElement('div');
        item.className = `review-item ${ok ? 'ok' : 'ng'}`;
        item.innerHTML = `
          <div><strong>${q.chapter}</strong></div>
          <div style="margin:8px 0; line-height:1.7;">${q.question}</div>
          <div class="mini">你的答案：${pickedLabel(q, selectedAnswers[q.id])}</div>
          <div class="mini">正確答案：${answerLabel(q)}</div>
        `;
        els.reviewList.appendChild(item);
      });
    }

    els.checkBtn.addEventListener('click', checkAnswer);
    els.prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex -= 1; render(); } });
    els.nextBtn.addEventListener('click', () => { if (currentIndex < sessionQuestions.length - 1) { currentIndex += 1; render(); } else { showSummary(false); } });
    els.generateBtn.addEventListener('click', generateSession);
    els.submitAllBtn.addEventListener('click', () => showSummary(false));
    els.restartBtn.addEventListener('click', generateSession);
    els.reviewBtn.addEventListener('click', () => showSummary(true));
    els.backQuizBtn.addEventListener('click', () => { els.summaryCard.classList.remove('show'); els.quizCard.style.display = 'block'; render(); });
    els.chapterFilter.addEventListener('change', generateSession);
    els.questionCount.addEventListener('change', generateSession);

    generateSession();
  </script>
</body>
</html>
